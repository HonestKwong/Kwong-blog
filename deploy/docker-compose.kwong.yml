services:
  kwong-web:
    image: ${KWONG_WEB_IMAGE}
    container_name: kwong-web
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.kwong
    volumes:
      - kwong_data:/app/data
    networks:
      - kwong_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  kwong_data:

networks:
  kwong_net:
    name: ${KWONG_DOCKER_NETWORK:-xray-network}
    external: true
